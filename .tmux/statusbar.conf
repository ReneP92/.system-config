# Hand-rolled status bar: rose-pine's minimal layout. Sourced by ~/.tmux.conf
# AFTER a palette file from themes/ in the repo - the THEME_TMUX_* variables
# must already be set (tmux registers them in the global environment when the
# palette file is parsed, before this file's parse expands them).

# Whether the pane is back at a plain shell (login shells show as "-zsh").
set -g @pane_at_shell '#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}}'

# AI agent activity indicator, shown inside the window name blocks next to the
# pane running the agent. @agent_state is set per pane by
# ~/.tmux/agent-status.sh, fed by each agent's own hooks/plugins (Claude Code
# and Cursor hooks, the OpenCode plugin):
#   idle     muted ○          agent open, nothing to do
#   busy     yellow spinner   working (braille frame animated by
#                             ~/.tmux/agent-spinner.sh, static ✳ fallback)
#   waiting  red ●            needs your input (permission, question, plan)
#   unset    no symbol        no agent in this pane
# A pane that is back at a plain shell never shows a symbol, so an agent that
# died without running its exit hook cannot leave a stale one behind.
set -g @agent_indicator "#{?#{E:@pane_at_shell},,#{?#{==:#{@agent_state},idle},#[fg=$THEME_TMUX_GUTTER]○ ,}#{?#{==:#{@agent_state},busy},#[fg=$THEME_TMUX_YELLOW]#{?#{@agent_spinner_frame},#{@agent_spinner_frame},✳} ,}#{?#{==:#{@agent_state},waiting},#[fg=$THEME_TMUX_RED]● ,}}"

# Pane label in the tab title: the pane command, as tmux reads it from the
# process name, with two fixes for agents whose binary is misleadingly named:
# - @agent_name, set for the pane while an agent runs. Cursor's CLI runs on a
#   bundled node, so .zshrc wraps `agent`/`cursor-agent` to set it to
#   "cursor" (ignored once the pane is back at a shell, in case it lingers).
# - Claude Code's native install runs a binary named after its version
#   (~/.local/share/claude/versions/2.1.318), mapped back to "claude".
set -g @pane_label '#{?#{&&:#{@agent_name},#{!:#{E:@pane_at_shell}}},#{@agent_name},#{s/^[0-9]+\.[0-9]+\.[0-9]+$/claude/:pane_current_command}}'

# The bar background is "default" (see-through with wezterm's translucent
# window) unless switched with `theme background solid`. THEME_TMUX_BG is
# also the text color on the colored blocks.
if-shell "grep -qx solid ~/.config/theme/background 2>/dev/null" \
  "set -g status-style 'fg=$THEME_TMUX_FG,bg=$THEME_TMUX_BG'" \
  "set -g status-style 'fg=$THEME_TMUX_FG,bg=default'"
set -g status-left-length 100
set -g status-left "#[fg=$THEME_TMUX_BG,bg=#{?client_prefix,$THEME_TMUX_YELLOW,$THEME_TMUX_BLUE}]  #S #[default]  "
set -g status-right-length 100
set -g status-right "#[fg=$THEME_TMUX_GREEN,bg=$THEME_TMUX_SURFACE]  #[fg=$THEME_TMUX_FG]#(~/.tmux/status-git.sh '#{pane_current_path}') #[default] #[fg=$THEME_TMUX_FG,bg=$THEME_TMUX_SURFACE] 󰘚 #[fg=$THEME_TMUX_FG_DARK]#(~/.tmux/status-cpu.sh) #[default] #[fg=$THEME_TMUX_FG_DARK,bg=$THEME_TMUX_SURFACE]  %a %d %b #[default] #[fg=$THEME_TMUX_BG,bg=$THEME_TMUX_BLUE]  %H:%M "

set-window-option -g window-status-separator " "
# Tab title lists every pane's command (" | "-separated); in multi-pane
# windows the active pane's command is highlighted in yellow. The agent
# indicator renders inside the loop, next to the pane running the agent
# (@agent_state is pane-scoped).
set-window-option -g window-status-format "#[fg=$THEME_TMUX_BG,bg=$THEME_TMUX_GUTTER] #I #[bg=$THEME_TMUX_SURFACE] #{P:#[fg=$THEME_TMUX_FG_DARK]#{?pane_index, | ,}#{E:@agent_indicator}#{?#{&&:#{pane_active},#{e|>:#{window_panes},1}},#[fg=$THEME_TMUX_YELLOW],#[fg=$THEME_TMUX_FG_DARK]}#{E:@pane_label}} "
set-window-option -g window-status-current-format "#[fg=$THEME_TMUX_BG,bg=$THEME_TMUX_YELLOW] #I #[bg=$THEME_TMUX_SURFACE] #{P:#[fg=$THEME_TMUX_FG]#{?pane_index, | ,}#{E:@agent_indicator}#{?#{&&:#{pane_active},#{e|>:#{window_panes},1}},#[fg=$THEME_TMUX_YELLOW],#[fg=$THEME_TMUX_FG]}#{E:@pane_label}} "
