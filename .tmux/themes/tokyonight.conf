# tokyonight (night) palette for the hand-rolled status bar (.tmux/statusbar.conf)
C_BG="#1a1b26"        # bar background (matches terminal bg)
C_SURFACE="#292e42"   # window name blocks (bg_highlight)
C_GUTTER="#737aa2"    # inactive window number blocks (dark5, readable behind C_BG text)
C_FG="#c0caf5"        # main text
C_FG_DARK="#a9b1d6"   # inactive window names (fg_dark)
C_YELLOW="#e0af68"    # active window number block, busy spinner, prefix hint
C_ORANGE="#ff9e64"    # waiting bell
C_BLUE="#7aa2f7"      # session block in status-left, time block in status-right
C_GREEN="#9ece6a"     # git branch icon in status-right
