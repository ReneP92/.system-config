# matte-black (Omarchy original) palette, ported from Omarchy
# (github.com/basecamp/omarchy, MIT) themes/matte-black/colors.toml at 5dff225.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Matte Black"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
THEME_FG="#bebebe"
THEME_BG="#121212"
THEME_CURSOR_BG="#bebebe"
THEME_CURSOR_FG="#121212"
THEME_SELECTION_BG="#333333"
THEME_SELECTION_FG="#bebebe"
THEME_ANSI_0="#2a2a2a"
THEME_ANSI_1="#d35f5f"
THEME_ANSI_2="#ffc107"
THEME_ANSI_3="#b91c1c"
THEME_ANSI_4="#e68e0d"
THEME_ANSI_5="#d35f5f"
THEME_ANSI_6="#bebebe"
THEME_ANSI_7="#bebebe"
THEME_ANSI_8="#555555"
THEME_ANSI_9="#b91c1c"
THEME_ANSI_10="#ffc107"
THEME_ANSI_11="#b90a0a"
THEME_ANSI_12="#f59e0b"
THEME_ANSI_13="#b91c1c"
THEME_ANSI_14="#eaeaea"
THEME_ANSI_15="#bebebe"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#121212"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#1e1e1e"   # window name blocks
THEME_TMUX_GUTTER="#8a8a8d"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#bebebe"        # main text
THEME_TMUX_FG_DARK="#8a8a8d"   # inactive window names
THEME_TMUX_YELLOW="#ffc107"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#d35f5f"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#e68e0d"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#ffc107"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#121212"
THEME_FZF_COLORS="fg:#8a8a8d,hl:#e68e0d,fg+:#bebebe,bg+:#333333,hl+:#e68e0d,info:#ffc107,prompt:#8a8a8d,pointer:#ffc107,marker:#d35f5f,spinner:#f59e0b,header:#8a8a8d"
