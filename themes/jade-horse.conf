# jade-horse (Omarchy original, jade greens) palette, ported from Omarchy
# (github.com/basecamp/omarchy, MIT) themes/jade-horse/colors.toml at 5dff225.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Jade Horse"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
THEME_FG="#dfede5"
THEME_BG="#142620"
THEME_CURSOR_BG="#f0faf4"
THEME_CURSOR_FG="#142620"
THEME_SELECTION_BG="#2b5147"
THEME_SELECTION_FG="#dfede5"
THEME_ANSI_0="#2b5147"
THEME_ANSI_1="#d88d91"
THEME_ANSI_2="#8bcbb1"
THEME_ANSI_3="#c5cc91"
THEME_ANSI_4="#96b7d0"
THEME_ANSI_5="#b7a1c8"
THEME_ANSI_6="#86c7c5"
THEME_ANSI_7="#dfede5"
THEME_ANSI_8="#64887b"
THEME_ANSI_9="#e6a6aa"
THEME_ANSI_10="#a7dfc5"
THEME_ANSI_11="#dce1ac"
THEME_ANSI_12="#b0cde3"
THEME_ANSI_13="#cfbce0"
THEME_ANSI_14="#a2dcda"
THEME_ANSI_15="#f0faf4"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#142620"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#203b31"   # window name blocks
THEME_TMUX_GUTTER="#64887b"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#dfede5"        # main text
THEME_TMUX_FG_DARK="#91ad9f"   # inactive window names
THEME_TMUX_YELLOW="#c5cc91"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#d88d91"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#8bcbb1"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#a7dfc5"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#142620"
THEME_FZF_COLORS="fg:#91ad9f,hl:#8bcbb1,fg+:#dfede5,bg+:#2b5147,hl+:#8bcbb1,info:#c5cc91,prompt:#91ad9f,pointer:#c5cc91,marker:#d88d91,spinner:#c5cc91,header:#86c7c5"
