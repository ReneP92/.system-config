# catppuccin (mocha) palette, ported from Omarchy
# (github.com/basecamp/omarchy, MIT) themes/catppuccin/colors.toml at 5dff225.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Catppuccin Mocha"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
THEME_FG="#cdd6f4"
THEME_BG="#1e1e2e"
THEME_CURSOR_BG="#cdd6f4"
THEME_CURSOR_FG="#1e1e2e"
THEME_SELECTION_BG="#45475a"
THEME_SELECTION_FG="#cdd6f4"
THEME_ANSI_0="#45475a"
THEME_ANSI_1="#f38ba8"
THEME_ANSI_2="#a6e3a1"
THEME_ANSI_3="#f9e2af"
THEME_ANSI_4="#89b4fa"
THEME_ANSI_5="#f5c2e7"
THEME_ANSI_6="#94e2d5"
THEME_ANSI_7="#cdd6f4"
THEME_ANSI_8="#585b70"
THEME_ANSI_9="#f38ba8"
THEME_ANSI_10="#a6e3a1"
THEME_ANSI_11="#f9e2af"
THEME_ANSI_12="#89b4fa"
THEME_ANSI_13="#f5c2e7"
THEME_ANSI_14="#94e2d5"
THEME_ANSI_15="#cdd6f4"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#1e1e2e"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#313244"   # window name blocks
THEME_TMUX_GUTTER="#7f849c"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#cdd6f4"        # main text
THEME_TMUX_FG_DARK="#a6adc8"   # inactive window names
THEME_TMUX_YELLOW="#f9e2af"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#f38ba8"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#89b4fa"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#a6e3a1"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#1e1e2e"
THEME_FZF_COLORS="fg:#a6adc8,hl:#f5c2e7,fg+:#cdd6f4,bg+:#45475a,hl+:#f5c2e7,info:#89dceb,prompt:#a6adc8,pointer:#cba6f7,marker:#f38ba8,spinner:#f9e2af,header:#94e2d5"
