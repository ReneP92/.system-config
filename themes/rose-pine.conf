# rose-pine (moon) palette, the default theme. One file per theme is the
# single source of truth for wezterm, tmux, fzf and the `theme` picker.
# Every line is THEME_KEY="value", so bash can `source` it, tmux can
# `source-file` it and .wezterm.lua parses it line by line.
THEME_LABEL="Rosé Pine Moon"

# terminal (wezterm's built-in rose-pine-moon, with a slightly darker base)
THEME_FG="#e0def4"
THEME_BG="#1f1d2e"
THEME_CURSOR_BG="#e0def4"
THEME_CURSOR_FG="#232136"
THEME_SELECTION_BG="#232136"
THEME_SELECTION_FG="#e0def4"
THEME_ANSI_0="#393552"
THEME_ANSI_1="#eb6f92"
THEME_ANSI_2="#9ccfd8"
THEME_ANSI_3="#f6c177"
THEME_ANSI_4="#3e8fb0"
THEME_ANSI_5="#c4a7e7"
THEME_ANSI_6="#ea9a97"
THEME_ANSI_7="#e0def4"
THEME_ANSI_8="#6e6a86"
THEME_ANSI_9="#eb6f92"
THEME_ANSI_10="#9ccfd8"
THEME_ANSI_11="#f6c177"
THEME_ANSI_12="#3e8fb0"
THEME_ANSI_13="#c4a7e7"
THEME_ANSI_14="#ea9a97"
THEME_ANSI_15="#e0def4"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#1f1d2e"        # bar background (matches terminal bg, darkened base)
THEME_TMUX_SURFACE="#2a273f"   # window name blocks (surface)
THEME_TMUX_GUTTER="#6e6a86"    # inactive window number blocks (muted)
THEME_TMUX_FG="#e0def4"        # main text
THEME_TMUX_FG_DARK="#908caa"   # inactive window names (subtle)
THEME_TMUX_YELLOW="#f6c177"    # active window number block, busy spinner, prefix hint (gold)
THEME_TMUX_ORANGE="#eb6f92"    # waiting bell (love)
THEME_TMUX_BLUE="#9ccfd8"      # session block in status-left, time block in status-right (foam)
THEME_TMUX_GREEN="#3e8fb0"     # git branch icon in status-right (pine)

# fzf (.zshrc); the background is only used with `theme background opaque`
THEME_FZF_BG="#1f1d2e"
THEME_FZF_COLORS="fg:#908caa,hl:#ea9a97,fg+:#e0def4,bg+:#393552,hl+:#ea9a97,info:#9ccfd8,prompt:#908caa,pointer:#c4a7e7,marker:#eb6f92,spinner:#f6c177,header:#3e8fb0"
