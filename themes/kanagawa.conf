# kanagawa (wave) palette, ported from Omarchy
# (github.com/basecamp/omarchy, MIT) themes/kanagawa/colors.toml at 5dff225.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Kanagawa Wave"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
THEME_FG="#dcd7ba"
THEME_BG="#1f1f28"
THEME_CURSOR_BG="#dcd7ba"
THEME_CURSOR_FG="#1f1f28"
THEME_SELECTION_BG="#2d4f67"
THEME_SELECTION_FG="#dcd7ba"
THEME_ANSI_0="#363646"
THEME_ANSI_1="#c34043"
THEME_ANSI_2="#76946a"
THEME_ANSI_3="#c0a36e"
THEME_ANSI_4="#7e9cd8"
THEME_ANSI_5="#957fb8"
THEME_ANSI_6="#6a9589"
THEME_ANSI_7="#dcd7ba"
THEME_ANSI_8="#727169"
THEME_ANSI_9="#e82424"
THEME_ANSI_10="#98bb6c"
THEME_ANSI_11="#e6c384"
THEME_ANSI_12="#7fb4ca"
THEME_ANSI_13="#938aa9"
THEME_ANSI_14="#7aa89f"
THEME_ANSI_15="#dcd7ba"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#1f1f28"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#2a2a37"   # window name blocks
THEME_TMUX_GUTTER="#727169"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#dcd7ba"        # main text
THEME_TMUX_FG_DARK="#c8c093"   # inactive window names
THEME_TMUX_YELLOW="#e6c384"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#e46876"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#7e9cd8"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#98bb6c"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#1f1f28"
THEME_FZF_COLORS="fg:#c8c093,hl:#ffa066,fg+:#dcd7ba,bg+:#2d4f67,hl+:#ffa066,info:#7fb4ca,prompt:#c8c093,pointer:#957fb8,marker:#e46876,spinner:#e6c384,header:#7aa89f"
