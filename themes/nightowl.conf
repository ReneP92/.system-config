# nightowl palette: Night Owl navy backgrounds with a neon "coolnight" ANSI
# palette. One file per theme is the single source of truth for wezterm,
# tmux, fzf and the `theme` picker. Every line is THEME_KEY="value", so bash
# can `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Night Owl"

# terminal
THEME_FG="#CBE0F0"
THEME_BG="#011423"
THEME_CURSOR_BG="#47FF9C"
THEME_CURSOR_FG="#011423"
THEME_SELECTION_BG="#033259"
THEME_SELECTION_FG="#CBE0F0"
THEME_ANSI_0="#214969"
THEME_ANSI_1="#E52E2E"
THEME_ANSI_2="#44FFB1"
THEME_ANSI_3="#FFE073"
THEME_ANSI_4="#0FC5ED"
THEME_ANSI_5="#a277ff"
THEME_ANSI_6="#24EAF7"
THEME_ANSI_7="#24EAF7"
THEME_ANSI_8="#214969"
THEME_ANSI_9="#E52E2E"
THEME_ANSI_10="#44FFB1"
THEME_ANSI_11="#FFE073"
THEME_ANSI_12="#A277FF"
THEME_ANSI_13="#a277ff"
THEME_ANSI_14="#24EAF7"
THEME_ANSI_15="#24EAF7"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#011423"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#143652"   # window name blocks (bg_highlight)
THEME_TMUX_GUTTER="#627E97"    # inactive window number blocks (fg_gutter)
THEME_TMUX_FG="#CBE0F0"        # main text
THEME_TMUX_FG_DARK="#B4D0E9"   # inactive window names
THEME_TMUX_YELLOW="#FFDA7B"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#FF7A85"       # agent waiting-for-input dot (soft red: ANSI red is too dark on SURFACE)
THEME_TMUX_BLUE="#65D1FF"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#3EFFDC"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#011628"
THEME_FZF_COLORS="fg:#CBE0F0,hl:#B388FF,fg+:#CBE0F0,bg+:#143652,hl+:#B388FF,info:#06BCE4,prompt:#2CF9ED,pointer:#2CF9ED,marker:#2CF9ED,spinner:#2CF9ED,header:#2CF9ED"
