# hackerman (Omarchy original, neon greens) palette, ported from Omarchy
# (github.com/basecamp/omarchy, MIT) themes/hackerman/colors.toml at 5dff225.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Hackerman"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
THEME_FG="#ddf7ff"
THEME_BG="#0b0c16"
THEME_CURSOR_BG="#ddf7ff"
THEME_CURSOR_FG="#0b0c16"
THEME_SELECTION_BG="#1f253a"
THEME_SELECTION_FG="#ddf7ff"
THEME_ANSI_0="#1f253a"
THEME_ANSI_1="#50f872"
THEME_ANSI_2="#4fe88f"
THEME_ANSI_3="#50f7d4"
THEME_ANSI_4="#829dd4"
THEME_ANSI_5="#86a7df"
THEME_ANSI_6="#7cf8f7"
THEME_ANSI_7="#ddf7ff"
THEME_ANSI_8="#4a5075"
THEME_ANSI_9="#85ff9d"
THEME_ANSI_10="#9cf7c2"
THEME_ANSI_11="#a4ffec"
THEME_ANSI_12="#c4d2ed"
THEME_ANSI_13="#cddbf4"
THEME_ANSI_14="#d1fffe"
THEME_ANSI_15="#ddf7ff"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#0b0c16"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#151828"   # window name blocks
THEME_TMUX_GUTTER="#6a6e95"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#ddf7ff"        # main text
THEME_TMUX_FG_DARK="#b5c5db"   # inactive window names
THEME_TMUX_YELLOW="#82fb9c"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#ff6b81"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#7cf8f7"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#4fe88f"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#0b0c16"
THEME_FZF_COLORS="fg:#b5c5db,hl:#82fb9c,fg+:#ddf7ff,bg+:#1f253a,hl+:#82fb9c,info:#7cf8f7,prompt:#b5c5db,pointer:#7cf8f7,marker:#ff6b81,spinner:#a4ffec,header:#829dd4"
