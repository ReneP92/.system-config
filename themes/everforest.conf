# everforest (dark medium) palette, ported from Omarchy
# (github.com/basecamp/omarchy, MIT) themes/everforest/colors.toml at 5dff225.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Everforest"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
THEME_FG="#d3c6aa"
THEME_BG="#2d353b"
THEME_CURSOR_BG="#d3c6aa"
THEME_CURSOR_FG="#2d353b"
THEME_SELECTION_BG="#475258"
THEME_SELECTION_FG="#d3c6aa"
THEME_ANSI_0="#3d484d"
THEME_ANSI_1="#e67e80"
THEME_ANSI_2="#a7c080"
THEME_ANSI_3="#dbbc7f"
THEME_ANSI_4="#7fbbb3"
THEME_ANSI_5="#d699b6"
THEME_ANSI_6="#83c092"
THEME_ANSI_7="#d3c6aa"
THEME_ANSI_8="#7a8478"
THEME_ANSI_9="#e67e80"
THEME_ANSI_10="#a7c080"
THEME_ANSI_11="#dbbc7f"
THEME_ANSI_12="#7fbbb3"
THEME_ANSI_13="#d699b6"
THEME_ANSI_14="#83c092"
THEME_ANSI_15="#d3c6aa"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#2d353b"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#343f44"   # window name blocks
THEME_TMUX_GUTTER="#859289"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#d3c6aa"        # main text
THEME_TMUX_FG_DARK="#9da9a0"   # inactive window names
THEME_TMUX_YELLOW="#dbbc7f"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#e67e80"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#7fbbb3"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#a7c080"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#2d353b"
THEME_FZF_COLORS="fg:#9da9a0,hl:#a7c080,fg+:#d3c6aa,bg+:#475258,hl+:#a7c080,info:#83c092,prompt:#9da9a0,pointer:#d699b6,marker:#e67e80,spinner:#dbbc7f,header:#83c092"
