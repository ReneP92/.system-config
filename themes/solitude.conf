# solitude (Omarchy original, ashen grays) palette, ported from Omarchy
# (github.com/basecamp/omarchy, MIT) themes/solitude/colors.toml at 5dff225.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Solitude"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
# bright green (10) is lightened: Omarchy's is nearly the background,
# which hides bold green text such as git branch names
THEME_FG="#cacccc"
THEME_BG="#101315"
THEME_CURSOR_BG="#a5aeb4"
THEME_CURSOR_FG="#101315"
THEME_SELECTION_BG="#343d41"
THEME_SELECTION_FG="#cacccc"
THEME_ANSI_0="#343d41"
THEME_ANSI_1="#565d60"
THEME_ANSI_2="#9fa5a9"
THEME_ANSI_3="#d9dbdc"
THEME_ANSI_4="#798186"
THEME_ANSI_5="#aeaeae"
THEME_ANSI_6="#707070"
THEME_ANSI_7="#cacccc"
THEME_ANSI_8="#5d6367"
THEME_ANSI_9="#de6145"
THEME_ANSI_10="#bcc1c4"
THEME_ANSI_11="#c9c2b4"
THEME_ANSI_12="#5d6367"
THEME_ANSI_13="#9a9a9a"
THEME_ANSI_14="#707070"
THEME_ANSI_15="#a5aeb4"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#101315"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#1b2023"   # window name blocks
THEME_TMUX_GUTTER="#798186"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#cacccc"        # main text
THEME_TMUX_FG_DARK="#a5aeb4"   # inactive window names
THEME_TMUX_YELLOW="#c9c2b4"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#de6145"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#798186"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#9fa5a9"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#101315"
THEME_FZF_COLORS="fg:#a5aeb4,hl:#de6145,fg+:#cacccc,bg+:#343d41,hl+:#de6145,info:#a5aeb4,prompt:#a5aeb4,pointer:#c9c2b4,marker:#de6145,spinner:#c9c2b4,header:#798186"
