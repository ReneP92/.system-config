# lumon (Omarchy original, all blues) palette, ported from Omarchy
# (github.com/basecamp/omarchy, MIT) themes/lumon/colors.toml at 5dff225.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Lumon"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
THEME_FG="#d6e2ee"
THEME_BG="#16242d"
THEME_CURSOR_BG="#f2fcff"
THEME_CURSOR_FG="#16242d"
THEME_SELECTION_BG="#243d56"
THEME_SELECTION_FG="#d6e2ee"
THEME_ANSI_0="#243d56"
THEME_ANSI_1="#4d86b0"
THEME_ANSI_2="#5e95bc"
THEME_ANSI_3="#6fa4c9"
THEME_ANSI_4="#6fb8e3"
THEME_ANSI_5="#8bc9eb"
THEME_ANSI_6="#b4e4f6"
THEME_ANSI_7="#d6e2ee"
THEME_ANSI_8="#4d6f8c"
THEME_ANSI_9="#73a6cb"
THEME_ANSI_10="#86b7d8"
THEME_ANSI_11="#9dcae5"
THEME_ANSI_12="#f2fcff"
THEME_ANSI_13="#b1d8ee"
THEME_ANSI_14="#d1eef8"
THEME_ANSI_15="#f2fcff"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#16242d"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#1b2d40"   # window name blocks
THEME_TMUX_GUTTER="#6d93b3"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#d6e2ee"        # main text
THEME_TMUX_FG_DARK="#9db7cc"   # inactive window names
THEME_TMUX_YELLOW="#d1eef8"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#e88388"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#6fb8e3"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#86b7d8"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#16242d"
THEME_FZF_COLORS="fg:#9db7cc,hl:#8bc9eb,fg+:#d6e2ee,bg+:#243d56,hl+:#8bc9eb,info:#b4e4f6,prompt:#9db7cc,pointer:#d1eef8,marker:#e88388,spinner:#d1eef8,header:#86b7d8"
