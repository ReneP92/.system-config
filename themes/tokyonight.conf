# tokyonight (night) palette. One file per theme is the single source of
# truth for wezterm, tmux, fzf and the `theme` picker. Every line is
# THEME_KEY="value", so bash can `source` it, tmux can `source-file` it and
# .wezterm.lua parses it line by line.
THEME_LABEL="Tokyo Night"

# terminal (wezterm's built-in tokyonight_night)
THEME_FG="#c0caf5"
THEME_BG="#1a1b26"
THEME_CURSOR_BG="#c0caf5"
THEME_CURSOR_FG="#1a1b26"
THEME_SELECTION_BG="#283457"
THEME_SELECTION_FG="#c0caf5"
THEME_ANSI_0="#15161e"
THEME_ANSI_1="#f7768e"
THEME_ANSI_2="#9ece6a"
THEME_ANSI_3="#e0af68"
THEME_ANSI_4="#7aa2f7"
THEME_ANSI_5="#bb9af7"
THEME_ANSI_6="#7dcfff"
THEME_ANSI_7="#a9b1d6"
THEME_ANSI_8="#414868"
THEME_ANSI_9="#f7768e"
THEME_ANSI_10="#9ece6a"
THEME_ANSI_11="#e0af68"
THEME_ANSI_12="#7aa2f7"
THEME_ANSI_13="#bb9af7"
THEME_ANSI_14="#7dcfff"
THEME_ANSI_15="#c0caf5"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#1a1b26"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#292e42"   # window name blocks (bg_highlight)
THEME_TMUX_GUTTER="#737aa2"    # inactive window number blocks (dark5, readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#c0caf5"        # main text
THEME_TMUX_FG_DARK="#a9b1d6"   # inactive window names (fg_dark)
THEME_TMUX_YELLOW="#e0af68"    # active window number block, busy spinner, prefix hint
THEME_TMUX_ORANGE="#ff9e64"    # waiting bell
THEME_TMUX_BLUE="#7aa2f7"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#9ece6a"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#1a1b26"
THEME_FZF_COLORS="fg:#c0caf5,hl:#2ac3de,fg+:#c0caf5,bg+:#283457,hl+:#2ac3de,info:#545c7e,prompt:#2ac3de,pointer:#ff007c,marker:#ff007c,spinner:#ff007c,header:#ff9e64"
