# nord palette, ported from Omarchy
# (github.com/basecamp/omarchy, MIT) themes/nord/colors.toml at 5dff225.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Nord"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
THEME_FG="#d8dee9"
THEME_BG="#2e3440"
THEME_CURSOR_BG="#d8dee9"
THEME_CURSOR_FG="#2e3440"
THEME_SELECTION_BG="#434c5e"
THEME_SELECTION_FG="#d8dee9"
THEME_ANSI_0="#3b4252"
THEME_ANSI_1="#bf616a"
THEME_ANSI_2="#a3be8c"
THEME_ANSI_3="#ebcb8b"
THEME_ANSI_4="#81a1c1"
THEME_ANSI_5="#b48ead"
THEME_ANSI_6="#88c0d0"
THEME_ANSI_7="#d8dee9"
THEME_ANSI_8="#616e88"
THEME_ANSI_9="#bf616a"
THEME_ANSI_10="#a3be8c"
THEME_ANSI_11="#ebcb8b"
THEME_ANSI_12="#81a1c1"
THEME_ANSI_13="#b48ead"
THEME_ANSI_14="#8fbcbb"
THEME_ANSI_15="#d8dee9"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#2e3440"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#3b4252"   # window name blocks
THEME_TMUX_GUTTER="#7b88a1"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#d8dee9"        # main text
THEME_TMUX_FG_DARK="#adb5c4"   # inactive window names
THEME_TMUX_YELLOW="#ebcb8b"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#bf616a"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#88c0d0"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#a3be8c"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#2e3440"
THEME_FZF_COLORS="fg:#adb5c4,hl:#88c0d0,fg+:#d8dee9,bg+:#434c5e,hl+:#88c0d0,info:#88c0d0,prompt:#adb5c4,pointer:#b48ead,marker:#bf616a,spinner:#ebcb8b,header:#8fbcbb"
