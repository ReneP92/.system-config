# retro-82 (Omarchy original) palette, ported from Omarchy
# (github.com/basecamp/omarchy, MIT) themes/retro-82/colors.toml at 5dff225.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Retro 82"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
THEME_FG="#f6dcac"
THEME_BG="#05182e"
THEME_CURSOR_BG="#f6dcac"
THEME_CURSOR_FG="#05182e"
THEME_SELECTION_BG="#134e5a"
THEME_SELECTION_FG="#f6dcac"
THEME_ANSI_0="#134e5a"
THEME_ANSI_1="#f85525"
THEME_ANSI_2="#028391"
THEME_ANSI_3="#e97b3c"
THEME_ANSI_4="#3f8f8a"
THEME_ANSI_5="#3f8f8a"
THEME_ANSI_6="#8cbfb8"
THEME_ANSI_7="#f6dcac"
THEME_ANSI_8="#2a6b78"
THEME_ANSI_9="#f85525"
THEME_ANSI_10="#028391"
THEME_ANSI_11="#e97b3c"
THEME_ANSI_12="#faa968"
THEME_ANSI_13="#3f8f8a"
THEME_ANSI_14="#8cbfb8"
THEME_ANSI_15="#f6dcac"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#05182e"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#0a2540"   # window name blocks
THEME_TMUX_GUTTER="#6f9f9b"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#f6dcac"        # main text
THEME_TMUX_FG_DARK="#a7c9c6"   # inactive window names
THEME_TMUX_YELLOW="#faa968"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#f85525"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#8cbfb8"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#3fa89f"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#05182e"
THEME_FZF_COLORS="fg:#a7c9c6,hl:#faa968,fg+:#f6dcac,bg+:#134e5a,hl+:#faa968,info:#8cbfb8,prompt:#a7c9c6,pointer:#e97b3c,marker:#f85525,spinner:#e97b3c,header:#8cbfb8"
