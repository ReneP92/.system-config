# abstract-black (community Omarchy theme, neutral black) palette, ported
# from github.com/devSviat/omarchy-abstract-black-theme (MIT) colors.toml at
# 8cef2ff. Its wallpapers are third-party art outside that license, so the
# wallpaper here is an original rendered in the same palette.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Abstract Black"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
THEME_FG="#d7dae0"
THEME_BG="#0b0b0b"
THEME_CURSOR_BG="#ffffff"
THEME_CURSOR_FG="#0b0b0b"
THEME_SELECTION_BG="#202329"
THEME_SELECTION_FG="#d7dae0"
THEME_ANSI_0="#2f3136"
THEME_ANSI_1="#e5545a"
THEME_ANSI_2="#57d9a3"
THEME_ANSI_3="#ecc46a"
THEME_ANSI_4="#5aa2f0"
THEME_ANSI_5="#a67cf0"
THEME_ANSI_6="#5cd0e0"
THEME_ANSI_7="#d7dae0"
THEME_ANSI_8="#5a5f6b"
THEME_ANSI_9="#ff757b"
THEME_ANSI_10="#7ceac0"
THEME_ANSI_11="#f7d68a"
THEME_ANSI_12="#86bcff"
THEME_ANSI_13="#c29aff"
THEME_ANSI_14="#8ae0ee"
THEME_ANSI_15="#ffffff"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#0b0b0b"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#171717"   # window name blocks
THEME_TMUX_GUTTER="#8d9199"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#d7dae0"        # main text
THEME_TMUX_FG_DARK="#8d9199"   # inactive window names
THEME_TMUX_YELLOW="#ecc46a"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#e5545a"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#8fb4de"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#57d9a3"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#0b0b0b"
THEME_FZF_COLORS="fg:#8d9199,hl:#8fb4de,fg+:#d7dae0,bg+:#202329,hl+:#8fb4de,info:#ecc46a,prompt:#8d9199,pointer:#ecc46a,marker:#e5545a,spinner:#ecc46a,header:#8d9199"
