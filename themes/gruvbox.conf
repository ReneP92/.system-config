# gruvbox (material dark) palette, ported from Omarchy
# (github.com/basecamp/omarchy, MIT) themes/gruvbox/colors.toml at 5dff225.
# One file per theme is the single source of truth for wezterm, tmux, fzf
# and the `theme` picker. Every line is THEME_KEY="value", so bash can
# `source` it, tmux can `source-file` it and .wezterm.lua parses it.
THEME_LABEL="Gruvbox"

# terminal (Omarchy's ANSI mapping, with black lifted off the background)
THEME_FG="#d4be98"
THEME_BG="#282828"
THEME_CURSOR_BG="#d4be98"
THEME_CURSOR_FG="#282828"
THEME_SELECTION_BG="#504945"
THEME_SELECTION_FG="#d4be98"
THEME_ANSI_0="#504945"
THEME_ANSI_1="#ea6962"
THEME_ANSI_2="#a9b665"
THEME_ANSI_3="#d8a657"
THEME_ANSI_4="#7daea3"
THEME_ANSI_5="#d3869b"
THEME_ANSI_6="#89b482"
THEME_ANSI_7="#d4be98"
THEME_ANSI_8="#7c6f64"
THEME_ANSI_9="#ea6962"
THEME_ANSI_10="#a9b665"
THEME_ANSI_11="#d8a657"
THEME_ANSI_12="#7daea3"
THEME_ANSI_13="#d3869b"
THEME_ANSI_14="#89b482"
THEME_ANSI_15="#d4be98"

# tmux status bar roles (.tmux/statusbar.conf)
THEME_TMUX_BG="#282828"        # bar background (matches terminal bg)
THEME_TMUX_SURFACE="#3c3836"   # window name blocks
THEME_TMUX_GUTTER="#928374"    # inactive window number blocks (readable behind THEME_TMUX_BG text)
THEME_TMUX_FG="#d4be98"        # main text
THEME_TMUX_FG_DARK="#a89984"   # inactive window names
THEME_TMUX_YELLOW="#d8a657"    # active window number block, busy spinner, prefix hint
THEME_TMUX_RED="#ea6962"       # agent waiting-for-input dot
THEME_TMUX_BLUE="#7daea3"      # session block in status-left, time block in status-right
THEME_TMUX_GREEN="#a9b665"     # git branch icon in status-right

# fzf (.zshrc); the background is only used with `theme background solid`
THEME_FZF_BG="#282828"
THEME_FZF_COLORS="fg:#a89984,hl:#e78a4e,fg+:#d4be98,bg+:#504945,hl+:#e78a4e,info:#89b482,prompt:#a89984,pointer:#d3869b,marker:#ea6962,spinner:#d8a657,header:#89b482"
